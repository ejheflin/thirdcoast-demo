<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>/control — the tournament runner</title>
<!-- Pinch-to-zoom is deliberately allowed here (maximum-scale=5, no
     user-scalable=no) -- reported genuinely useful on a large bracket
     on the iPad, not just the phone tree overlay, so it's page-wide
     rather than scoped to one view. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<!-- Add to Home Screen runs it without browser chrome, which is how the
     venue iPad would hold it: full height, no URL bar over the board strip -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Control">
<!--
  /control, SECOND DRAFT — the tournament-night runner.

  Built to the brief in docs/design/control-the-brief.md. The parts of it
  that shaped this file, in the order they mattered:

  1. THIRTY-SECOND HANDOVER. No typing anywhere. Every action is a tap
     whose consequence is visible before you make it, and everything is
     undoable from the acknowledgement.

  2. THE COURT IS THE INDEX. "We won" is the commonest thing said to the
     controller all night, and the court is the only thing she and the
     player can both see. Tap the court, tap the winner: two taps, no
     league, no team names, no reading.

  3. SPATIAL AND STABLE. The courts sit in the venue's own bank order and
     never move. The tree's columns are its rounds and never reflow. What
     changes is a match's APPEARANCE, never its position.

  4. THE TREE IS POPULATED BY SEED, so the tree draws SEEDS -- "3 v 11"
     fits where "Bump, Set, Dammit!" cannot, which is what lets a whole
     eight-round double-elim bracket sit on a tablet with no scrolling.
     Names appear in the detail panel, once she has picked something.

  5. LEAGUE CHIPS FADE THE MAP rather than filtering it. A faded court is
     still selectable -- the fade removes noise, it does not remove the
     option.

  6. PICKERS ARE BLADES. They sweep in over the layout, take one tap and
     sweep out, and the thing behind them stays visible so she never
     loses her place.

  TWO SHAPES, ONE SET OF PARTS. The tablet at the controller table is the
  primary: courts and tree side by side, because "am I on the right
  match?" is answered by seeing both highlighted at once. The phone is
  the walking-around case: the same parts in one column, with the tree as
  an overlay. No scrolling is needed for the loop in either.

  Interactive on the captured three-league night. Picking a winner really
  advances the bracket and frees the court; nothing is sent anywhere.

  SERVE over HTTP:  cd prototype && python -m http.server 8099
-->
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --ground:#0B1220; --panel:#141C2C; --card:#1B2437; --raised:#232E45; --line:#2C3752;
  --ink:#FFFFFF; --dim:#8E99AB; --faint:#5D6779;
  --live:#FF00A0; --live-txt:#FF6EC7; --won:#8CC63F; --pend:#2E9BFF;
  --time:#FFC400; --on-fill:#06070A; --sand:#D9C9A3;
  --gap:10px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--ground);color:var(--ink);overflow:hidden;
  font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums;
  display:flex;flex-direction:column;
  /* ON A TOUCHSCREEN, four browser reflexes get in the way of a
     controller: the URL bar eating the bottom strip, a grey flash on
     every tap, a long press selecting a team name, and the whole page
     rubber-banding when she means to scroll a list. */
  height:100dvh;                     /* 100% is the fallback above */
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
  overscroll-behavior:none;
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
#inbox,#matrix,#tree{-webkit-overflow-scrolling:touch}

/* ═══ the strip along the top: who am I looking at ═══════════════ */
/* three columns, so the slicer is centred on the RIBBON rather than on
   whatever space the mark and the board indicator happen to leave. The
   side columns shrink before the middle one does, so a fourth league
   pushes nothing off the screen. */
#top{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  gap:12px;padding:9px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.tright{display:flex;align-items:center;gap:12px;justify-self:end;min-width:0}
.mark{font-family:"Archivo Black",sans-serif;font-size:15px;text-transform:uppercase;
  letter-spacing:.02em;flex:none}
.mark em{font-style:normal;color:var(--won)}
#chips{display:flex;gap:7px;justify-content:center;min-width:0;overflow:hidden}
/* ── THE SLICER ────────────────────────────────────────────────────
   The 999px pills were the only fully round thing in a design built on
   hard corners, colour slabs and letterspaced caps -- and the count
   inside one was a circle at a single digit and an oval at two.

   A broadcast tab strip instead: no shape at all beyond a rule under the
   league in view, and the count drawn exactly like the counts on the
   rail's group headers, which already existed. Three other styles were
   rendered and dropped -- see chips.html.

   The count has to clear the round badge's background, radius AND size:
   a button lays its content out in an anonymous box that stretches a
   block-level child to the full height, so patching only the radius
   turned the badge into a tall yellow bar. */
#chips.underline{gap:1px}
#chips.underline .lchip{padding:9px 12px 6px;border-radius:0;background:none;
  border-bottom:3px solid transparent;color:var(--dim);
  font-size:13.5px;letter-spacing:.11em}
#chips.underline .lchip.on{background:none;color:var(--ink);border-bottom-color:var(--pend)}
#chips.underline .act,#chips.underline .act.clear{display:inline;background:none;padding:0;
  min-width:0;height:auto;border-radius:0;box-shadow:none;margin-left:7px;
  font-size:12.5px;color:var(--time)}
#chips.underline .act.clear{color:var(--faint)}

.lchip{flex:none;padding:9px 13px;border-radius:999px;background:var(--card);
  font-size:14px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  white-space:nowrap;box-shadow:inset 0 0 0 2px transparent}
.lchip.on{background:var(--pend);color:var(--on-fill)}
/* HOW MANY GAMES ARE PLAYED IS NOT A THING SHE ACTS ON. The chip
   carries what that league is waiting on her for; a tick means it is
   running itself. Played out of total still sits over the tree. */
.lchip .act{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;
  margin-left:7px;border-radius:999px;background:var(--time);color:var(--on-fill);
  font-family:"Archivo Black",sans-serif;font-size:11.5px;vertical-align:middle}
.lchip .act.clear{background:none;color:var(--faint);font-size:13px}
.lchip.off{opacity:.34}
.iconbtn{flex:none;width:42px;height:42px;border-radius:11px;background:var(--card);
  display:grid;place-items:center;font-size:19px}
/* the labelled variant: same height and the same tap target, just wide
   enough to say what it opens */
.iconbtn.lbl{width:auto;padding:0 11px;grid-auto-flow:column;gap:7px;
  font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.iconbtn.lbl svg{width:15px;height:16px;display:block}
.tspacer{display:none}

/* ═══ the body: three zones on a tablet, one column on a phone ═══ */
#body{flex:1;min-height:0;display:grid;gap:var(--gap);padding:var(--gap);
  grid-template-columns:308px minmax(0,1fr) 316px;grid-template-rows:auto minmax(0,1fr);
  grid-template-areas:"courts tree rail" "matrix tree rail"}
/* min-width:0 as well as min-height: a grid 1fr resolves against its
   content's min-content width, and without this the phone column grew
   wider than the phone */
.zone{background:var(--panel);border-radius:14px;min-height:0;min-width:0;
  display:flex;flex-direction:column;overflow:hidden}
#zcourts{grid-area:courts}
#zmatrix{grid-area:matrix}
#ztree{grid-area:tree}
#zrail{grid-area:rail}
.zhead{flex:none;display:flex;align-items:baseline;gap:8px;padding:11px 13px 9px}
.zhead h2{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim)}
.zhead .n{margin-left:auto;font-family:"Archivo Black",sans-serif;font-size:12px;color:var(--time)}
.zhead .tog{margin-left:auto;display:flex;gap:0;border-radius:999px;overflow:hidden;
  box-shadow:inset 0 0 0 1px var(--line)}
.zhead .tog button{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
  padding:5px 10px;color:var(--faint)}
.zhead .tog button.on{background:var(--pend);color:var(--on-fill)}

/* ── the courts, in the venue's bank order ───────────────────────
   A proper 3x5 grid, not three stretched columns: every court is the
   same horizontal rectangle, and the two in the middle bank sit at the
   top of their column leaving three rows blank — which is what the
   venue's floor actually looks like.

   THE PAINT IS A FILL, NOT A BORDER. It is the court's identity and it
   never moves: the slab on the left is always the real colour, whether
   the court is busy or free. That leaves the outline free to mean one
   thing only — this is the one you have selected — so selecting a court
   never changes its colour. */
/* minmax(0,...), not bare 1fr: a bare 1fr track refuses to shrink below
   its content's natural width, so at a phone's width the third column
   never actually got 1/3 -- it just overflowed the zone, which clips
   (.zone{overflow:hidden}) rather than scrolls. There is no affordance
   to reach a clipped court on a real phone at all. */
#courts{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  grid-template-rows:repeat(5,52px);gap:6px;padding:0 11px 11px;align-content:start}
.ct{border-radius:9px;display:flex;overflow:hidden;background:var(--card);padding:0;
  box-shadow:inset 0 0 0 1px var(--line);transition:opacity .16s,transform .12s}
.ct .slab{flex:none;width:36px;background:var(--paint);display:grid;place-items:center}
.ct .n{font-family:"Archivo Black",sans-serif;font-size:17px;line-height:1;color:var(--pink)}
.ct .b{flex:1;min-width:0;padding:5px 8px;display:flex;flex-direction:column;
  justify-content:center;gap:1px;text-align:left}
.ct .sv{font-family:"Archivo Black",sans-serif;font-size:13px;line-height:1.1}
.ct .el{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
/* a court can carry a future assignment as well as what is on it now:
   the championship can be promised to court 2 while court 2 is busy */
.ct .nx{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--pend);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct.free{background:transparent}
.ct.free .b{color:var(--faint)}
.ct.free .sv{font-family:"Barlow Condensed",sans-serif;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;font-weight:600}
/* court 7 is black: the slab needs the board's sand ring to exist at all */
.ct.dark .slab{box-shadow:inset 0 0 0 2px rgba(217,201,163,.5)}
.ct.dimmed{opacity:.3}
.ct.hl{box-shadow:0 0 0 2px var(--ink),0 0 0 5px rgba(255,255,255,.13);transform:scale(1.015)}
/* THE MIDDLE BANK IS STAGGERED, because it is staggered on the floor --
   about half a court down from the two outer banks. `top` on a relative
   grid item resolves against its own grid area, so this is half a row
   whatever the row height is, and it leaves `transform` free for the
   selection scale. */
.ct.mid,.cm.mid{position:relative;top:50%}

/* ── the team matrix: names live here, so the tree can keep seeds ──
   Every team still alive, in seed order, with where it is right now. It
   cross-highlights with the courts and the bracket: tapping court 8
   lights the match in the tree AND both of its rows here. */
#matrix{flex:1;min-height:0;overflow:auto;padding:0 11px 11px}
.tr{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border-radius:8px;
  background:transparent;text-align:left;margin-bottom:3px;transition:background .12s}
.tr .sd{font-family:"Archivo Black",sans-serif;font-size:12px;color:var(--faint);
  min-width:17px;text-align:right}
.tr .nm{flex:1;min-width:0;font-size:13.5px;font-weight:700;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .dot{flex:none;width:15px;height:15px;border-radius:4px;background:var(--paint)}
.tr .wh{flex:none;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
/* All mode only: which bracket this row belongs to, since a bare team
   name no longer says that on its own once every league is on screen
   together. Same small faint-uppercase treatment as .wh, and .it .s
   over on the Action Items rail. */
.tr .lgtag{flex:none;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.tr.hl{background:var(--raised);box-shadow:inset 0 0 0 2px var(--ink)}
.tr.two{opacity:.62}
.tr.gone{opacity:.3}
.tr.gone .nm{text-decoration:line-through}

/* Team search: its own panel, not the dense many-rows-at-once Teams
   matrix -- there's room to make both the typing and the reading of it
   easy at a glance, so this scales #tsBox/#tsResults up well past .tr's
   base sizing without touching the matrix itself. */
#tsBox{width:100%;box-sizing:border-box;font-family:inherit;font-size:24px;
  font-weight:700;padding:16px 18px;margin:2px 0 16px;border-radius:12px;
  border:0;background:var(--card);color:var(--ink)}
#tsBox::placeholder{color:var(--faint);font-weight:400}
#tsResults .tr{padding:16px 14px;margin-bottom:8px;border-radius:12px}
#tsResults .tr .sd{font-size:19px;min-width:22px}
#tsResults .tr .nm{font-size:22px}
#tsResults .tr .wh,#tsResults .tr .lgtag{font-size:15px}
#tsResults .tr .dot{width:20px;height:20px}
#tsResults .hint{font-size:17px}

/* ── the tree: rounds are columns, chips are seeds ─────────────────
   Seeds, because names do not fit: the twelve-team league's losers side
   is five columns of 97px, which holds a thirty-character name at 6px.
   Measured, not guessed. The names are in the matrix, and the two
   highlight each other.

   STATE IS A BAR, NOT A BORDER. Coloured borders on the chips read as if
   they meant a court; the bar on the left edge is pink for on court and
   blue for ready, a settled match simply fades, and the outline means
   one thing only — selected. */
/* scrollbar-gutter matters here: #tree scrolls, so its own clientWidth
   shrank by a scrollbar exactly when detailed mode made it tall enough
   to need one -- and since the layout is measured from that width, the
   two modes then disagreed by a few pixels and the lock came undone.
   Reserving the gutter always also stops the content jumping sideways
   the moment a scrollbar appears. */
#tree{flex:1;min-height:0;overflow:auto;scrollbar-gutter:stable;padding:0 11px 12px;
  position:relative}
/* ── WHAT IS THIS MATCH WAITING FOR ────────────────────────────────
   Dotted, because a dotted line is a thing that has not happened yet,
   and in the pending blue, which already means exactly that. It lives
   inside the scroll content so it travels with the chips, and it is the
   first child so every chip paints over it. */
/* #deps by id when one league fills the whole pane; .deps by class,
   one per open All-mode accordion section (deps-0, deps-1, …) — ids
   must stay unique, so All mode can't reuse the bare id for each one. */
#deps,.deps{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
#deps polyline,.deps polyline{fill:none;stroke:var(--pend);stroke-width:1.5;stroke-dasharray:3 4;
  stroke-linecap:round;opacity:.9}
.m.dep{outline:1px dashed var(--pend);outline-offset:2px}
.lane{margin-bottom:14px}
.lanelab{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:6px}
.lanelab.W{color:var(--pend)}.lanelab.L{color:var(--live-txt)}.lanelab.F{color:var(--time)}
.rlabs{display:flex;margin-bottom:4px}
.rlabs>div{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);text-align:center;white-space:nowrap;overflow:hidden}
.cols{display:flex;position:relative}
.col{position:relative}

/* ── All mode: one league's bracket per collapsible section ────────
   Not an accordion in the strict sense -- opening one doesn't close
   another, because there's no single "the" league to fall back to
   once you're viewing every league at once. */
.treesec{margin-bottom:9px;border-radius:10px;background:var(--card);overflow:hidden}
.treesechead{display:flex;align-items:center;gap:9px;width:100%;padding:11px 12px;
  text-align:left;font-family:inherit;color:inherit}
.treesechead .car{flex:none;width:12px;color:var(--faint);font-size:11px}
.treesechead .nm{flex:1;min-width:0;font-size:13.5px;font-weight:700;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.treesechead .cnt{flex:none;font-size:11px;color:var(--faint)}
.treesec.open .treesechead{padding-bottom:8px}
/* deliberately NOT position:relative -- the .deps svg inside is
   position:absolute and drawDeps()'s geometry is computed against
   #tree's own bounding rect (see drawDeps()), which only lines up if
   #tree stays the nearest positioned ancestor for every section's
   overlay, not each section individually. */
.treesecbody{padding:0 12px 12px}
.treesec:not(.open) .treesecbody{padding:0}

/* ── THE TREE FITS ITS PANE ────────────────────────────────────────
   The columns are MEASURED, not assumed: drawTree divides the pane it
   actually has between the rounds of each lane, so a lane fills the
   width instead of leaving a hole in landscape or running off the edge
   in portrait. Widths land inline; the only rule here is that they do
   not flex afterwards.

   The same arithmetic runs in both modes, so the width is still locked:
   the toggle changes the height of a chip and nothing else.

   When a lane cannot give every round MINW, its LAST round wraps to a
   row underneath rather than the whole lane scrolling sideways -- the
   final is one match and it reads perfectly well below the bracket. */
.col,.rlabs>div{flex:none;min-width:0}
.rlabs.wrapped{margin-top:10px}
.rlabs.wrapped>div{text-align:left;color:var(--dim);display:flex;align-items:center;gap:6px}
/* an elbow drawn with borders: the arrow glyph is not in the latin
   subsets these fonts ship, so it rendered as a blank box */
.rlabs.wrapped>div:before{content:"";flex:none;width:6px;height:8px;
  border-left:1px solid var(--line);border-bottom:1px solid var(--line);
  margin-bottom:3px}

.m{position:absolute;left:0;right:0;height:34px;border-radius:7px;background:var(--card);
  box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;gap:5px;
  padding:0 6px 0 11px;overflow:hidden;
  /* top and height are animated by the FLIP in drawTree(); a chip that
     is merely re-rendered has no old value to move from, so a normal
     redraw does not animate. */
  transition:box-shadow .12s, top .26s cubic-bezier(.22,.8,.3,1),
             height .26s cubic-bezier(.22,.8,.3,1)}
/* at a locked 150px the two seeds sat hard left with a hole beside
   them, which read as an accident rather than a layout */
/* the court sits on the LEFT, where the paint sits on every other card
   in this design -- and where the detailed chip puts its slab, so the
   two modes agree about which edge means "court" */
.m:not(.d){justify-content:center;padding:0 11px 0 28px}
.m:not(.d) .ctn{position:absolute;left:7px;margin:0}
/* NO STATE COLOURS AT ALL. Pink and blue both got asked about, which
   was the answer twice over: the chip already says it without them. A
   court dot means it is out, dashes mean it is waiting on a feeder, a
   fade means it is played, and anything else is ready. Nothing to
   learn, nothing to explain, no key. */
.m.done{opacity:.4;box-shadow:none}
.m.done .win{color:var(--won)}
.m.hl{box-shadow:0 0 0 2px var(--ink),0 0 0 5px rgba(255,255,255,.12);background:var(--raised)}
.m .s{font-family:"Archivo Black",sans-serif;font-size:14px;line-height:1;min-width:16px;
  text-align:center}
.m .vs{font-size:8.5px;padding:0 3px}
/* the court's NUMBER, not just its colour: the colour says which court
   to someone who knows the floor, and the number says it to everyone
   else -- and both together are what every other card in this design
   shows. Archivo Black at 10.5px clears two digits inside 19px. */
.m .ctn{margin-left:auto;flex:none;width:19px;height:17px;border-radius:4px;
  background:var(--paint,var(--raised));display:grid;place-items:center;line-height:1;
  font-family:"Archivo Black",sans-serif;font-size:10.5px;color:var(--pink,var(--dim))}
.m .ctn.dark{box-shadow:inset 0 0 0 1.5px rgba(217,201,163,.5)}
.m .tbd{color:var(--faint)}

/* ── DETAILED: the same tree, spending height instead of width ─────
   Condensed is seeds because names do not fit ACROSS a five-column
   lane. Detailed does not fight that: it stacks the two teams and
   anchors the court on the left, the way every player-facing card
   does, and the font sizes stay where they were -- the chip got
   taller, not louder.

   Which means the columns have to stop flexing. At 546px of pane a
   five-column lane gives each chip 97px, and 97px minus the court slab
   holds about four letters of a team name. So a column takes a floor
   width in this mode and a wide lane scrolls sideways: the trade the
   client opted into, and only in the mode that asks for it. --dw is
   that floor, tunable with ?dw= while we pick it. */
.cols{transition:height .26s cubic-bezier(.22,.8,.3,1)}
/* the content swaps in one frame, so it fades rather than snaps -- and
   only on a mode change, not on every redraw of the tree */
@keyframes chipin{from{opacity:0}to{opacity:1}}
#tree.swap .m>*{animation:chipin .26s ease-out both}
.m.d{padding:0;gap:0;align-items:stretch;overflow:hidden}
/* the court anchors the left edge whether or not there is one yet, so
   the two team rows start at the same x on every chip in the column */
.m.d .cs{flex:none;width:27px;background:var(--paint,var(--raised));
  display:grid;place-items:center;color:var(--pink,var(--faint))}
.m.d .cs b{font-family:"Archivo Black",sans-serif;font-size:12.5px}
.m.d .cs.none{background:var(--raised);color:var(--faint)}
.m.d .cs.none b{font-size:11px}
.m.d .cs.dark{box-shadow:inset 0 0 0 2px rgba(217,201,163,.5)}
/* A <button> centres its text by UA default, which quietly centred every
   team name in the chip -- so one name sat indented from the other and
   the column had no left edge to read down. */
.m.d .tt{flex:1;min-width:0;display:flex;flex-direction:column;
  justify-content:center;gap:2px;padding:0 7px;text-align:left}
.m.d .r{display:flex;align-items:baseline;gap:6px;min-width:0}
.m.d .r .s{font-family:"Archivo Black",sans-serif;font-size:12px;line-height:1;
  color:var(--faint);flex:none;min-width:14px;text-align:right}
.m.d .r .nm{flex:1;min-width:0;font-size:11.5px;font-weight:700;line-height:1.15;
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m.d .r.win .s,.m.d .r.win .nm{color:var(--won)}
.m.d .r.wait .nm{font-weight:600;color:var(--faint)}
/* the same divider the player cards use between two teams: a hairline
   with the vs mark sitting in it */
.m.d .dv{display:flex;align-items:center;gap:5px;margin:1px 0}
.m.d .dv:before,.m.d .dv:after{content:"";flex:1;height:1px;background:var(--line)}
.m.d .dv i{font-style:normal;font-size:8px;letter-spacing:.07em;
  text-transform:lowercase;color:var(--pend)}

/* ── the rail: what is selected, then what is waiting ─────────── */
#sel{flex:none;padding:0 11px 11px}
.selcard{background:var(--card);border-radius:12px;padding:11px 12px 12px}
.selmeta{display:flex;gap:7px;align-items:center;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.selmeta .lg{color:var(--pend)}
.selmeta .ct{margin-left:auto;font-family:"Archivo Black",sans-serif;color:var(--time)}
.side{display:flex;align-items:center;gap:8px;width:100%;padding:11px 10px;border-radius:9px;
  background:var(--raised);margin-bottom:6px;text-align:left}
.side .sd{font-family:"Archivo Black",sans-serif;font-size:15px;color:var(--faint);min-width:18px}
.side .nm{font-size:17px;font-weight:700;text-transform:uppercase;line-height:1.1;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .tick{font-size:11px;letter-spacing:.1em;color:var(--faint)}
.side.won{background:var(--won);color:var(--on-fill)}
.side.won .sd,.side.won .tick{color:rgba(6,7,10,.6)}
.side.lost{opacity:.4}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.act{flex:1;min-width:88px;padding:11px 9px;border-radius:9px;background:transparent;
  box-shadow:inset 0 0 0 2px var(--line);color:var(--dim);
  font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;min-height:44px}
.act.pri{background:var(--won);color:var(--on-fill);box-shadow:none}
.act.mic{background:var(--time);color:var(--on-fill);box-shadow:none}
.hint{padding:22px 14px;color:var(--faint);font-size:14px;line-height:1.5;text-align:center}
.hint b{color:var(--dim);display:block;font-size:15px;margin-bottom:5px}

#queue{flex:1;min-height:0;overflow:auto;padding:0 11px 11px}
.q{background:var(--card);border-radius:11px;padding:9px 10px 10px;margin-bottom:7px}
.qm{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
.qm .lg{color:var(--pend)}
.qt{font-size:15px;font-weight:700;text-transform:uppercase;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qgo{width:100%;margin-top:8px;padding:11px;border-radius:9px;background:var(--won);
  color:var(--on-fill);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  min-height:44px}
.qgo .c{font-family:"Archivo Black",sans-serif;font-size:16px}
.qgo.none{background:var(--raised);color:var(--faint)}

/* ═══ the bottom strip: the board itself, and config ═════════════ */
#foot{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px;
  background:var(--panel);border-top:1px solid var(--line)}
#ribbon{flex:none;display:flex;gap:6px;padding:8px 12px 0;overflow-x:auto;background:var(--panel)}
.ribicon{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 10px;border-radius:9px;background:var(--card);min-width:46px}
.ribicon .k{font-family:"Archivo Black",sans-serif;font-size:13px;line-height:1}
.ribicon .lg{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);
  white-space:nowrap}
.ribicon.on{background:var(--pend);color:var(--on-fill)}
.ribicon.on .lg{color:var(--on-fill);opacity:.75}
#foot .lab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
#foot .scr{font-size:14px;font-weight:700;text-transform:uppercase;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:250px}
#foot .sp{flex:1}
.fbtn{padding:10px 13px;border-radius:9px;background:var(--card);font-size:12.5px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;min-height:42px}
.fbtn.on{background:var(--time);color:var(--on-fill)}

/* ═══ popovers ══════════════════════════════════════════════════════
   Two levels: the match bubble, and a picker opened from inside it.
   Both attach to the thing that was tapped and open to the RIGHT, or
   flip left when there is no room. This replaces the sweep-in blade for
   picking a court — a picker should appear next to what it is picking
   for, not at the edge of the screen. */
.pop{position:fixed;z-index:66;background:var(--card);border-radius:13px;
  box-shadow:0 20px 50px rgba(0,0,0,.55),inset 0 0 0 1px var(--line);overflow:hidden;
  opacity:0;transform:translateY(6px) scale(.97);pointer-events:none;
  transition:opacity .13s,transform .13s}
.pop.in{opacity:1;transform:none;pointer-events:auto}
#bub2{z-index:67}
/* Tap-away-to-close already works, but a fingertip on glass keeps
   wanting a literal target -- reported from real iPhone use, not
   tablet. Sits INSIDE the card's own corner (.pop clips its overflow)
   rather than straddling the border, so the card never has to grow to
   make room for it. */
.xclose{position:absolute;top:7px;right:7px;z-index:5;width:23px;height:23px;
  border-radius:50%;background:rgba(6,7,10,.38);color:var(--ink);
  display:grid;place-items:center;font-size:13px;line-height:1}
.xclose:active{background:rgba(6,7,10,.58)}
.pophead{padding:10px 12px 2px;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--dim)}
/* the court picker IS the map: same three banks, same paint, so the
   choice is made in the same shape she reads the floor in */
.cmap{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(5,38px);
  gap:5px;padding:9px 11px 12px}
.cm{border-radius:8px;display:flex;align-items:center;gap:5px;padding:0 0 0 0;overflow:hidden;
  background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.cm .s{flex:none;width:26px;align-self:stretch;background:var(--paint);display:grid;place-items:center}
.cm .s span{font-family:"Archivo Black",sans-serif;font-size:13px;color:var(--pink)}
.cm .l{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);
  white-space:nowrap;overflow:hidden}
/* A COURT IN USE IS HATCHED, NOT JUST FADED. Fade alone had to be deep
   enough to read as "unavailable", which took the paint down with it --
   and the paint is how she knows which court it is. So the fade comes
   back up and diagonal black stripes carry "in use" instead. The number
   stays above the hatch: still selectable, because a future match can be
   promised to a busy court. */
.cm.busy{opacity:.66}
.cm.busy .s{position:relative}
.cm.busy .s:after{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(45deg,
    rgba(0,0,0,.82) 0 2px, rgba(0,0,0,0) 2px 5px)}
.cm.busy .s span{position:relative;z-index:1}
.cm.busy .l{color:var(--dim)}
.cm.here{box-shadow:0 0 0 2px var(--ink)}
.cm.dark .s{box-shadow:inset 0 0 0 2px rgba(217,201,163,.5)}
/* NOT A COURT -- deliberately the opposite treatment from every .cm cell
   above: no --paint fill (there is no court identity to carry), a dashed
   outline instead of the solid inset line every real cell gets, and the
   same muted faint/dim text an .iconbtn or .popitem uses for a plain
   utility action. The one thing it borrows from .cm is grid positioning,
   so it sits in the map without pretending to be part of the floor. */
.cm.unassign{background:transparent;box-shadow:none;border:1px dashed var(--line)}
.cm.unassign .s{background:none}
.cm.unassign .s span{font-family:inherit;font-size:15px;font-weight:700;color:var(--faint)}
.cm.unassign .l{color:var(--faint)}
.poplist{padding:2px 10px 10px}
/* the cards in a popover are the cards in the list -- same shape, so
   there is nothing new to read */
.pop .it{background:var(--raised);margin-bottom:5px}
.pop .it:last-child{margin-bottom:0}
.popitem{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;text-align:left}
/* a tap leaves :hover stuck on iOS, so hover is for pointers only */
@media (hover:hover){.popitem:hover{background:var(--raised)}}
.popitem .sd{font-family:"Archivo Black",sans-serif;font-size:12px;color:var(--faint);min-width:34px}
.popitem .nm{flex:1;min-width:0;font-size:14px;font-weight:700;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.popitem .mn{flex:none;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}

/* ═══ the match bubble ═════════════════════════════════════════════
   The player screens' card, shrunk: the court's colour and number
   anchored on the left, the two names stacked with the rule between
   them. It is instantly recognisable because it is the same object the
   television has been showing all night.

   Tap a name to make it the winner. Tap the court to change it. One
   button underneath, and it is the microphone. */
#bub{width:300px}
#bub .top{display:flex;min-height:96px}
#bub .cslab{flex:none;width:66px;background:var(--paint,var(--raised));display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:2px}
#bub .cslab .n{font-family:"Archivo Black",sans-serif;font-size:26px;line-height:1;
  color:var(--pink,var(--dim))}
#bub .cslab .lab{font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--pink,var(--dim));opacity:.7}
#bub .who{flex:1;min-width:0;padding:9px 11px;display:flex;flex-direction:column;justify-content:center}
#bub .bmeta{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
  margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bub .bmeta b{color:var(--pend);font-weight:600}
#bub .side{display:flex;align-items:baseline;gap:7px;width:100%;padding:5px 4px;border-radius:7px;
  text-align:left;margin:0}
#bub .side .sd{font-family:"Archivo Black",sans-serif;font-size:13px;color:var(--faint);min-width:15px}
#bub .side .nm{font-size:17px;font-weight:700;text-transform:uppercase;line-height:1.1;
  flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bub .side.won{background:var(--won);color:var(--on-fill)}
#bub .side.won .sd{color:rgba(6,7,10,.55)}
#bub .side.lost{opacity:.4}
#bub .side .tick{margin-left:auto;flex:none;font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint)}
#bub .side.won .tick{color:rgba(6,7,10,.55)}
/* a slot with no team yet names what it is waiting for, so it is a tap
   target that points at the blockage rather than dead text */
#bub .side.tbd .nm{font-size:14px;color:var(--dim)}
#bub .side.tbd .tick{color:var(--time)}
#bub .rule{display:flex;align-items:center;gap:7px;margin:3px 0;color:var(--faint);
  font-size:9px;letter-spacing:.16em;text-transform:uppercase}
#bub .rule:before,#bub .rule:after{content:"";flex:1;height:1px;background:var(--line)}
#bub .foot{display:flex;gap:1px;border-top:1px solid var(--line)}
#bub .foot button{flex:1;padding:13px 8px;font-size:12.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--dim);min-height:46px}
#bub .foot button.mic{color:var(--time)}
@media (hover:hover){#bub .foot button.mic:hover{background:rgba(255,196,0,.12)}}

/* ═══ the inbox — what is waiting on her ═══════════════════════════ */
#inbox{flex:1;min-height:0;overflow:auto;padding:0 11px 12px}
.ihead{display:flex;align-items:baseline;gap:7px;padding:9px 2px 6px;font-size:10.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.ihead b{font-family:"Archivo Black",sans-serif;font-size:12px;color:var(--ink)}
.ihead .c{margin-left:auto;font-family:"Archivo Black",sans-serif;color:var(--time)}
.it{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;border-radius:10px;
  background:var(--card);margin-bottom:6px;text-align:left;cursor:pointer}
.it .b{flex:1;min-width:0;display:block}
/* flex, not block, so the two team names truncate INDEPENDENTLY: each
   .tn gets an ellipsis of its own and the "vs" between them never
   shrinks. As one line of text it was whichever name came first that
   survived, and the second could be cut to nothing. */
.it .t{display:flex;align-items:baseline;min-width:0;
  font-size:13.5px;font-weight:700;text-transform:uppercase}
.it .t .tn{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .t .vs{flex:none}
.it .s{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .s .mins{font-family:"Archivo Black",sans-serif;font-weight:400;color:var(--time)}
/* the same selection that lights the courts, the tree and the teams
   lights the list -- a card with no court yet simply never matches a
   court, which is the honest answer rather than a missing one */
.it.hl{background:var(--raised);box-shadow:inset 0 0 0 2px var(--ink)}

/* THE COURT CHIP, one fixed size. It was padded text, so court 11 drew
   a wider chip than court 8 and the column edge wobbled down the list.
   And it is the LEFT slab now, where it sits on every player-facing
   card, instead of a second chip on the right that meant something
   else. Grey TBD when there is no court: a green chip read as done. */
.it .cc{flex:none;width:36px;height:32px;border-radius:8px;cursor:pointer;
  background:var(--paint,var(--raised));display:grid;place-items:center;
  color:var(--pink,var(--dim))}
.it .cc b,.it .cc i{font-family:"Archivo Black",sans-serif;font-style:normal;font-size:14px}
.it .cc.tbd{background:var(--raised);box-shadow:inset 0 0 0 1px var(--line)}
.it .cc.tbd i{font-size:9.5px;letter-spacing:.05em;color:var(--faint)}
.it .cc.dark{box-shadow:inset 0 0 0 2px rgba(217,201,163,.5)}

/* TWO NAMES ON ONE LINE RAN TOGETHER. The v is its own mark in the
   pending blue, lowercase, so the line breaks where the eye needs it. */
.vs{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:11px;
  letter-spacing:.04em;text-transform:lowercase;color:var(--pend);padding:0 5px}

/* what a placeholder is waiting for, pointed at rather than described */
@keyframes flashring{0%,100%{outline-color:transparent}50%{outline-color:var(--time)}}
.flash{outline:3px solid transparent;outline-offset:2px;
  animation:flashring .19s steps(1,end) 5}

/* ═══ blades and sheets ═════════════════════════════════════════ */
#blade{position:fixed;top:0;right:0;bottom:0;width:min(440px,86vw);background:var(--panel);
  border-left:1px solid var(--line);z-index:60;transform:translateX(102%);
  transition:transform .22s cubic-bezier(.22,.8,.3,1);display:flex;flex-direction:column;
  box-shadow:-24px 0 60px rgba(0,0,0,.45)}
#blade.in{transform:none}
#blade .bh{flex:none;display:flex;align-items:center;gap:10px;padding:14px 14px 10px}
#blade .bh h3{font-family:"Archivo Black",sans-serif;font-size:17px;text-transform:uppercase}
#blade .bh .x{margin-left:auto;width:40px;height:40px;border-radius:10px;background:var(--card);
  display:grid;place-items:center;font-size:20px;color:var(--dim)}
#blade .bb{flex:1;min-height:0;overflow:auto;padding:0 14px 16px}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.pchip{width:64px;height:58px;border-radius:11px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;border:2px solid var(--paint);color:var(--paint);
  font-family:"Archivo Black",sans-serif;font-size:19px}
.pchip small{font-family:"Barlow Condensed",sans-serif;font-size:9px;letter-spacing:.06em;
  text-transform:uppercase;font-weight:600;opacity:.8}
.pchip.dark{border-color:rgba(217,201,163,.5);color:var(--sand)}
.pchip.taken{opacity:.32}
.pchip.here{background:var(--paint);color:var(--pink)}
.trow{display:flex;align-items:center;gap:10px;width:100%;padding:13px 12px;border-radius:10px;
  background:var(--card);margin-bottom:7px;text-align:left}
.trow .sd{font-family:"Archivo Black",sans-serif;font-size:15px;color:var(--faint);min-width:20px}
.trow .nm{font-size:17px;font-weight:700;text-transform:uppercase;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow.on{background:var(--pend);color:var(--on-fill)}
.crow{display:flex;align-items:center;gap:11px;width:100%;padding:13px 12px;border-radius:10px;
  background:var(--card);margin-bottom:7px;text-align:left;font-size:16px;font-weight:700;
  text-transform:uppercase}
.crow .sw{width:30px;height:30px;border-radius:8px;background:var(--raised);flex:none;
  display:grid;place-items:center;font-size:15px;color:var(--faint)}
.crow.on .sw{background:var(--won);color:var(--on-fill)}
#scrim{position:fixed;inset:0;background:rgba(4,7,12,.55);z-index:50;opacity:0;pointer-events:none;
  transition:opacity .2s}
#scrim.in{opacity:1;pointer-events:auto}
/* a popover is not a drawer: dim enough to read as dismissible, light
   enough that the floor behind it is still legible -- a coordinator
   picking a court is comparing the popup against the courts. */
#scrim.soft{background:rgba(4,7,12,.3)}

/* ═══ the acknowledgement, and undo inside it ═══════════════════ */
#toast{position:fixed;left:50%;bottom:66px;transform:translateX(-50%) translateY(14px) scale(.97);
  display:flex;align-items:center;gap:12px;background:var(--won);color:var(--on-fill);
  padding:11px 12px 11px 18px;border-radius:999px;z-index:70;opacity:0;pointer-events:none;
  transition:opacity .16s,transform .16s;max-width:92vw;
  box-shadow:0 14px 40px rgba(0,0,0,.45)}
#toast.up{opacity:1;transform:translateX(-50%) translateY(0) scale(1);pointer-events:auto}
#toast .t{font-size:15px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast .u{flex:none;background:rgba(6,7,10,.16);padding:9px 15px;border-radius:999px;
  font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}

/* ═══ the phone: same parts, one column, tree as an overlay ═════ */
#treebtn,#matrixbtn{display:none}
@media (max-width:1023px){
  #body{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);
    grid-template-areas:"courts" "rail"}
  #zmatrix{position:fixed;inset:0;z-index:55;border-radius:0;transform:translateY(101%);
    transition:transform .24s cubic-bezier(.22,.8,.3,1)}
  #zmatrix.in{transform:none}
  #matrixbtn{display:grid}
  #ztree{position:fixed;inset:0;z-index:55;border-radius:0;transform:translateY(101%);
    transition:transform .24s cubic-bezier(.22,.8,.3,1)}
  #ztree.in{transform:none}
  #zcourts{min-height:232px}
  #treebtn{display:grid}
  /* justify-content:flex-start, overriding the centered base rule: with
     enough leagues (now six chips counting All) the strip is WIDER than
     a phone, and centering an overflowing flex row clips both ends
     evenly with no way to scroll to the missing part of either one --
     confirmed live, the All chip landed mostly off the left edge and
     stayed there at scrollLeft 0. Pinning the start makes the overflow
     a normal scrollable list instead: chip 1 is always fully in view,
     scroll right for the rest. */
  #chips{order:3;flex-basis:100%;overflow-x:auto;justify-content:flex-start}
  /* #top was still `display:grid` here -- flex-wrap is a flexbox
     property and does nothing on a grid container, so #chips's
     order/flex-basis above were dead code and the league tabs were
     never actually promoted to their own row. They stayed jammed into
     the grid's narrow middle "auto" track instead, squeezed to almost
     nothing by the brand mark and the board/icons cluster on either
     side -- confirmed on a real iPhone, not just a layout guess.
     display:flex is what makes flex-wrap (and #chips's order and
     flex-basis) actually take effect; justify-content:space-between
     keeps the mark and that cluster pinned to opposite edges on their
     own row now that chips no longer shares it. */
  #top{display:flex;flex-wrap:wrap;justify-content:space-between}
  /* the button row gets a line of its own, with the two overlay buttons
     pushed left and the search/settings pair pushed right */
  .tright{order:2;flex-basis:100%;justify-content:flex-start}
  .tspacer{display:block;flex:1}
  .zhead .close{margin-left:auto}
  /* #foot never wraps and body{overflow:hidden} has no scrollbar to
     offer, so at a phone's width the label ate enough room that "next"
     and "slower" were pushed past the edge and simply unreachable --
     not a cropped-but-scrollable inconvenience, a dead button. Dropping
     the label is what buys the room back without shrinking a single
     tap target. */
  #foot .lab,#foot .scr{display:none}
}

/* ═══ a phone drops the two board strips entirely ═══════════════════
   Dropping the label above bought the buttons room to exist; it did not
   make them worth their height. On a phone the ribbon and the footer
   together cost about 110px of the only screen there is, and the
   screen they cost it to is the one an operator actually works on --
   courts and action items.

   The ribbon loses nothing: which screens are in the rotation is also
   in the gear menu's "Tonight" blade, and the ribbon is the shortcut,
   not the only way. The footer is a real trade: hold / prev / next /
   slower have no other call site, so they are gone on a phone. That is
   deliberate. The controller's device is an iPad, where this rule never
   fires; a phone is the over-the-shoulder second screen, and driving
   the board's rotation from one was never the job.

   Two queries, not one: a phone in portrait is caught by width, and a
   phone in landscape (930x430) by height -- and the height arm is kept
   under 1023 so that a merely short desktop window keeps its footer. */
@media (max-width:620px),
       (max-width:1023px) and (max-height:520px){
  #ribbon,#foot{display:none}

  /* ── and the page scrolls ──────────────────────────────────────
     Everywhere else this is a fixed-viewport app: the window is the
     frame, and the lists inside it scroll. That holds as long as the
     frame really is the window, which on a phone it is not -- browser
     chrome comes and goes, an added home-screen bar or a zoomed text
     size changes the sums, and the failure mode is the one the courts
     grid comment above already names: a zone clips, and there is no
     affordance to reach what was clipped.

     So on a phone the document itself is allowed to grow and scroll.
     The zones size to their content rather than to a share of a height
     that may not exist, and anything that does not fit is reachable by
     doing the most obvious thing in the world to it. The inner lists
     keep their own scrolling for when they are the long part; this is
     the outer fallback, not a replacement.

     Not extended to the iPad: there the window genuinely is the frame,
     and a page that scrolls under a coordinator's thumb mid-tournament
     is worse than one that does not. */
  html,body{height:auto;min-height:100dvh;overflow:visible}
  body{overflow-x:hidden;-webkit-overflow-scrolling:touch}
  #body{height:auto;grid-template-rows:auto auto}
  .zone{min-height:0;height:auto}
  #zcourts{min-height:232px}
  /* these two are fixed full-screen overlays and must stay that way */
  #zmatrix,#ztree{height:100dvh}
}
@media (min-width:1024px){ .zhead .close{display:none} }
</style>
</head>
